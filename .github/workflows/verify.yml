name: Verify Lean certificate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      AKLT_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: .lake
          key: lean-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: lean-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Install the pinned Lean toolchain and mathlib cache
        uses: leanprover/lean-action@v1
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'
      - name: Build the proof and audit its axioms
        run: ./scripts/check.sh
      - name: Save verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-verification-logs
          path: audit/*.log
          if-no-files-found: ignore
